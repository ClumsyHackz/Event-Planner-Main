<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Dashboard</title><link rel="stylesheet" href="../css/style.css"><script src="../js/auth.js"></script></head><body><main style="max-width:1100px;margin:40px auto;padding:24px"><a href="../login.html">Sign out / Login</a><h1>Admin Dashboard</h1><div id="summary">Loading summary…</div><h2>Pending event approvals</h2><div id="pending">Loading…</div><h2>Accounts</h2><div id="users">Loading…</div></main><script>
const token=localStorage.getItem('eventPlannerToken');const headers={Authorization:`Bearer ${token}`,'Content-Type':'application/json'};async function load(){try{let r=await fetch('/api/admin/summary',{headers});let d=await r.json();if(!r.ok)throw Error(d.error);document.getElementById('summary').innerHTML=`<p>Users: ${d.users} · Events: ${d.events} · Registrations: ${d.registrations} · Attendance: ${d.attendanceRate}% · Pending: ${d.pending}</p>`;r=await fetch('/api/admin/pending-events',{headers});d=await r.json();document.getElementById('pending').innerHTML=d.events.map(e=>`<article style="border:1px solid #ddd;border-radius:10px;padding:14px;margin:12px 0"><h3>${esc(e.title)}</h3><p>${esc(e.description)}</p><p>Organizer: ${esc(e.organizer?.name)} · ${esc(e.venue)}</p><button onclick="review('${e._id}','approved')">Approve</button> <button onclick="review('${e._id}','rejected')">Reject</button></article>`).join('')||'No pending events.';r=await fetch('/api/admin/users',{headers});d=await r.json();document.getElementById('users').innerHTML=d.users.map(u=>`<p>${esc(u.name)} (${esc(u.email)}) — ${u.role}${u.role==='organizer'?` — Club verified: ${u.clubVerified} <button onclick="verify('${u._id}',${!u.clubVerified})">${u.clubVerified?'Unverify':'Verify club'}</button>`:''}</p>`).join('')}catch(e){document.getElementById('summary').textContent=e.message}}async function review(id,decision){const reason=decision==='rejected'?prompt('Reason for rejection?')||'Please revise and resubmit':'';const r=await fetch(`/api/admin/events/${id}/review`,{method:'PATCH',headers,body:JSON.stringify({decision,reason})});const d=await r.json();if(!r.ok)alert(d.error);load()}async function verify(id,verified){const r=await fetch(`/api/admin/users/${id}/verify-club`,{method:'PATCH',headers,body:JSON.stringify({verified})});const d=await r.json();if(!r.ok)alert(d.error);load()}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}load();
</script></body></html>
