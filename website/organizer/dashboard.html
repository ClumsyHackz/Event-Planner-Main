<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Organizer Dashboard</title><link rel="stylesheet" href="../css/style.css"><script src="../js/auth.js"></script></head><body><main style="max-width:1000px;margin:40px auto;padding:24px"><a href="../login.html">Sign out / Login</a><h1>Organizer Dashboard</h1><p>Create an event draft or submit an event for admin approval. Your club must be verified before submitting.</p><form id="eventForm" style="display:grid;gap:12px;max-width:650px"><input name="title" placeholder="Event title" required><textarea name="description" placeholder="Description" required></textarea><select name="category"><option>Academic</option><option>Sports</option><option>Cultural</option><option>Technology</option><option>Other</option></select><input name="venue" placeholder="Venue" required><label>Starts at <input type="datetime-local" name="startsAt" required></label><label>Ends at <input type="datetime-local" name="endsAt"></label><input type="number" name="capacity" min="1" value="100" required><div><button name="action" value="draft">Save draft</button> <button name="action" value="submit">Submit for approval</button></div></form><p id="message"></p><h2>My events</h2><div id="events">Loading…</div></main><script>
const token=localStorage.getItem('eventPlannerToken');const form=document.getElementById('eventForm');form.addEventListener('submit',async e=>{e.preventDefault();const action=e.submitter.value;const body=Object.fromEntries(new FormData(form));body.action=action;try{const r=await fetch('/api/organizer/events',{method:'POST',headers:{Authorization:`Bearer ${token}`,'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw Error(d.error);document.getElementById('message').textContent=`Event ${action==='submit'?'submitted for review':'saved as draft'}.`;form.reset();load()}catch(err){document.getElementById('message').textContent=err.message}});async function load(){try{const r=await fetch('/api/organizer/events',{headers:{Authorization:`Bearer ${token}`}});const d=await r.json();if(!r.ok)throw Error(d.error);document.getElementById('events').innerHTML=d.events.map(e=>`<p><b>${esc(e.title)}</b> — ${e.status} <button onclick="submitEvent('${e._id}')">Submit draft</button></p>`).join('')||'No events yet.'}catch(e){document.getElementById('events').textContent=e.message}}async function submitEvent(id){const r=await fetch(`/api/organizer/events/${id}/submit`,{method:'PATCH',headers:{Authorization:`Bearer ${token}`}});const d=await r.json();document.getElementById('message').textContent=d.error||'Submitted for review';load()}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}load();
</script></body></html>
